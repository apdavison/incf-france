version: '3.6'

services:
  db:
    image: postgres:10.5-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
  web:
    build: .
    ports:
      - 8009:80
      - 8010:443
    #environment:
    #  - SECRET_KEY=changemeinprod
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - db

volumes:
  postgres_data:
