<md-grid-list md-cols="9" md-gutter="1em" md-row-height="1:1">
    <md-grid-tile class="project md-clickable logo" ui-sref="project({ id: project.label })" ng-repeat="project in $ctrl.projects">
            <img src="{{project.logo}}">
            <md-grid-tile-footer><h3>{{project.name}}</h3></md-grid-tile-footer>
    </md-grid-tile>
    <md-grid-tile>
        <md-button ng-if="$ctrl.canAddProject()" class="md-icon-button" aria-label="Add project" ui-sref="new-project">
            <md-icon>add</md-icon>
        </md-button>
    </md-grid-tile>

</md-grid-list>
